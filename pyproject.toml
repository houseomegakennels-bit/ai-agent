[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "codex-telegram-bridge"
version = "0.1.0"
description = "Telegram bot bridge for controlling Codex safely."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = [
    "pytest>=8.0",
]

[project.scripts]
codex-telegram-bridge = "codex_telegram_bridge.bot:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/codex_telegram_bridge"]
